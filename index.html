<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBookGuy — Physical Book Archive</title>
  <meta name="description" content="Tangible physical books and large-print historical puzzles.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Minimal Clean Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="brand-monogram">TBG</span>
        <span class="brand-title">TheBookGuy</span>
      </a>
      <div class="header-nav">
        <!-- Subtle hidden quest terminal trigger -->
        <button class="btn-quest-secret" id="open-vault-btn" title="Archive Quest Terminal">
          <span class="quest-dot"></span>
        </button>
        <a href="https://amazon.com" target="_blank" rel="noopener" class="nav-amazon-link">Amazon Store ↗</a>
      </div>
    </div>
  </header>

  <!-- Compact Introduction -->
  <section class="intro-bar">
    <div class="intro-inner">
      <h1 class="intro-title">Physical Editions</h1>
      <p class="intro-sub">Screen-free large-print puzzles and journals fulfilled on Amazon.</p>
    </div>
  </section>

  <!-- Compact Gallery Catalog -->
  <main class="catalog-section" id="catalog">
    <div class="catalog-container">
      <div class="book-grid" id="book-grid">
        <!-- Dynamically rendered compact tiles -->
      </div>
    </div>
  </main>

  <!-- Hidden Quest Terminal (Only opens via secret dot or URL) -->
  <div class="vault-modal" id="vault-modal">
    <div class="vault-backdrop" id="vault-overlay"></div>
    <div class="vault-panel">
      <div class="vault-panel-header">
        <span class="vault-mono-prefix">// ARCHIVAL QUEST</span>
        <button class="vault-close-btn" id="vault-close">&times;</button>
      </div>
      
      <p class="vault-instruction">
        Enter your book's numeric coordinate:
      </p>

      <div class="terminal-bar">
        <span class="terminal-caret">&gt;</span>
        <input type="text" id="vault-code-input" placeholder="00.000.00.0000.0000.0000.000" autocomplete="off" spellcheck="false">
        <button id="vault-submit-btn">UNLOCK</button>
      </div>

      <div class="terminal-output" id="vault-result"></div>
    </div>
  </div>

  <!-- Minimalist Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span>TheBookGuy Physical Editions • Fulfilled via Amazon</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
